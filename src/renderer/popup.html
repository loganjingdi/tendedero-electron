<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>划词翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <span class="title">划词翻译</span>
      <button class="close" id="close" title="关闭">✕</button>
    </div>
    <div class="body" id="body">
      <div class="loading" id="loading">识别中…</div>
      <div class="text" id="text"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="footer">
      <button class="action" id="translate">翻译</button>
      <button class="action" id="copy">复制文本</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
